name: Crawl jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/crawler/**"
      - ".github/workflows/crawl.yml"
      - "supabase/functions/github-ingest/**"
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: jobsbd-crawler
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/crawler/requirements.txt

      - name: Install crawler dependencies
        working-directory: services/crawler
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: services/crawler
        run: pytest -q

      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          audience="jobsbd-ai-ingest"
          token_json="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Check ingest authentication
        shell: bash
        env:
          INGEST_ENDPOINT: https://hxywgajeikdvoxbiohfq.supabase.co/functions/v1/github-ingest
          INGEST_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail --silent --show-error             -H "Authorization: Bearer $INGEST_OIDC_TOKEN"             -H "Content-Type: application/json"             --data '{"action":"health"}'             "$INGEST_ENDPOINT"

      - name: Crawl and ingest jobs
        working-directory: services/crawler
        env:
          INGEST_ENDPOINT: https://hxywgajeikdvoxbiohfq.supabase.co/functions/v1/github-ingest
          INGEST_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python runner.py
