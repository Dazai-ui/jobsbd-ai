name: Crawl jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/crawler/requirements.txt

      - name: Install crawler dependencies
        working-directory: services/crawler
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: services/crawler
        run: pytest -q

      - name: Crawl official sources
        working-directory: services/crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            python runner.py
          else
            echo "Supabase secrets are not configured yet; running a live dry-run instead."
            DRY_RUN=true python runner.py
          fi
