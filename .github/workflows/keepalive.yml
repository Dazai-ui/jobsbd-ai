name: Keep crawler schedule active

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 * *"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Refresh monthly heartbeat
        shell: bash
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/crawler-heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/crawler-heartbeat.txt

          if git diff --cached --quiet; then
            echo "Heartbeat unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "chore: keep scheduled crawler active"
          git push
